[package]
name = "email-rust"
version = "0.1.0"
edition = "2021"
authors = ["alex <truonggiang.axyl@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http", "axum", "queue"] }
worker-macros = { version = "0.8", features = ["http", "queue"] }
axum = { version = "0.8", default-features = false }
tower-service = "0.3.3"
resend-rs = { version = "0.29.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
js-sys = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
urlencoding = "2.1"
